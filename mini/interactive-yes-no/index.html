<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Interactive Yes/No</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="scene">
    <div class="card">
      <h1 class="question">Would you like to code?</h1>
      <div class="controls">
        <button id="yesBtn" class="btn yes">Yes</button>
        <button id="noBtn" class="btn no">No</button>
      </div>
      <div id="message" class="message" role="status" aria-live="polite" aria-atomic="true" hidden>
        <span class="check" aria-hidden="true">✔️</span>
        We know you'd come around <span aria-hidden="true">😉</span>
      </div>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
